</head>
<body>
      <div class="container">
        <div class="home-menu">
            <header>
                <nav class="mySidenav" id="mySidenav">

                    </div>
                    <div class="menu">

                        <p>Prontuario</a>

                        <p>Aluno</a>

                    </div>
                    <div class="config">
                        <a href="">Configurações</a>
                        <a href="../../login/index.html">Sair</a> <!-- Mantém essa estrutura ou padroniza no js? -->
                    </div>
                </nav>
            </header>
            <div class="home-menu" id="content-core">
                <main>
                    <div id="home" class="home">
                        <div class="perfil" id="perfil">
                            <div class="esquerda">
                                <svg id="barra-menu" onclick="openNav()" xmlns="http://www.w3.org/2000/svg" data-name="menu" viewBox="0 0 24 24"><path d="M24,12c0,.276-.224,.5-.5,.5H.5c-.276,0-.5-.224-.5-.5s.224-.5,.5-.5H23.5c.276,0,.5,.224,.5,.5ZM.5,5H23.5c.276,0,.5-.224,.5-.5s-.224-.5-.5-.5H.5c-.276,0-.5,.224-.5,.5s.224,.5,.5,.5Zm23,14H.5c-.276,0-.5,.224-.5,.5s.224,.5,.5,.5H23.5c.276,0,.5-.224,.5-.5s-.224-.5-.5-.5Z"/></svg>
                        
                                <img class="logo-fam" id="logo-fam" src="../home/imagens/logo_empresa.png" alt="Imagem do logo da universidade FAM - Centro universitário das Américas"> 
                            </div>

                            <div class="direita">   
                                <p>Nome do aluno<br>
                                RA</p>
                                <svg class="logo-perfil" xmlns="http://www.w3.org/2000/svg" data-name="LogoPerfil" viewBox="0 0 24 24"><path d="m12,0C5.383,0,0,5.383,0,12s5.383,12,12,12,12-5.383,12-12S18.617,0,12,0Zm-5,21.797v-.797c0-2.757,2.243-5,5-5s5,2.243,5,5v.797c-1.501.769-3.201,1.203-5,1.203s-3.499-.434-5-1.203Zm11-.582v-.215c0-3.309-2.691-6-6-6s-6,2.691-6,6v.215c-3.008-1.965-5-5.362-5-9.215C1,5.935,5.935,1,12,1s11,4.935,11,11c0,3.853-1.992,7.25-5,9.215ZM12,5c-2.206,0-4,1.794-4,4s1.794,4,4,4,4-1.794,4-4-1.794-4-4-4Zm0,7c-1.654,0-3-1.346-3-3s1.346-3,3-3,3,1.346,3,3-1.346,3-3,3Z"/></svg><!--Icone do Perfil-->
                            </div>
                        </div>
                    </div>
                </main>

                <footer>
                    <div class="termos">
                        <a href="">Termos de uso</a>
                        <a href="">Política & Privacidade</a>
                    </div>
                    <img src="../home/imagens/Patrocinadores.png" alt=""><!--Imagem da FAM e seu patrocinadores-->
                </footer>
            </div>
            
        </div>

        <script>
            function openNav() {
                document.getElementById("mySidenav").style.width = "15vw";
                document.getElementById("logo-fam").style.marginLeft = "2vw";
                document.getElementById("perfil").style.setProperty(
                    "border-bottom",
                    "1px solid #FF8400"
                );
                perfil.style.setProperty(
                    "box-shadow",
                    "0 5px 4px -4px rgba(0, 0, 0, 0.2)"
                );
                document.getElementById("barra-menu").style.display = "none";
                document.getElementById("barra-menu").style.opacity = "1";
                document.getElementById("barra-menu").style.pointerEvents = "none";
            }

            function closeNav() {
                document.getElementById("mySidenav").style.width = "0";
                document.getElementById("perfil").style.setProperty(
                    "border-bottom",
                    "1px solid #FF8400"
                );
                perfil.style.setProperty(
                    "box-shadow",
                    "0 5px 4px -4px rgba(0, 0, 0, 0.2)"
                );
                document.getElementById("barra-menu").style.display = "block";
                document.getElementById("barra-menu").style.pointerEvents = "all";
                document.getElementById("barra-menu").style.opacity = "1";
            }
        </script>
    </div>
</body>
</html>
