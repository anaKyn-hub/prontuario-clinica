<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/styleCadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="corpo">
        <header>
            <img id="logo1" src="src/imgs/logo_empresa.png" alt="Logo da FAM">
            <img id="logo2" src="src/imgs/logo_clinica.png" alt="Logo da Clinica da FAM"> 
        </header>
        <main>
            <div id="titulo">
                <h1>Crie seu Cadastro</h1>
                <p id="descricao">Preencha seus dados para realizar o cadastro em nossa plataforma.</p>
            </div>

            <form action="../login/index.html">
                <div class="agrup_campo">
                    <label for="fname">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" viewBox="0 0 24 24" width="512" height="512"><path d="M12,12A6,6,0,1,0,6,6,6.006,6.006,0,0,0,12,12ZM12,2A4,4,0,1,1,8,6,4,4,0,0,1,12,2Z"/><path d="M12,14a9.01,9.01,0,0,0-9,9,1,1,0,0,0,2,0,7,7,0,0,1,14,0,1,1,0,0,0,2,0A9.01,9.01,0,0,0,12,14Z"/></svg>
                        Nome
                    </label>
                    <input class="campo" type="text" id="fname" name="fname">
                </div>

                <div class="agrup_campo">
                    <label for="lname">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" viewBox="0 0 24 24" width="512" height="512"><path d="M12,12A6,6,0,1,0,6,6,6.006,6.006,0,0,0,12,12ZM12,2A4,4,0,1,1,8,6,4,4,0,0,1,12,2Z"/><path d="M12,14a9.01,9.01,0,0,0-9,9,1,1,0,0,0,2,0,7,7,0,0,1,14,0,1,1,0,0,0,2,0A9.01,9.01,0,0,0,12,14Z"/></svg>
                        Sobrenome
                    </label>
                    <input class="campo" type="text" id="lname" name="lname">
                </div>

                <div class="agrup_campo">
                    <label for="ra">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" data-name="Layer 1" viewBox="0 0 24 24" width="512" height="512"><path d="M19,22H5c-2.757,0-5-2.243-5-5V7C0,4.243,2.243,2,5,2h14c2.757,0,5,2.243,5,5v10c0,2.757-2.243,5-5,5ZM5,4c-1.654,0-3,1.346-3,3v10c0,1.654,1.346,3,3,3h14c1.654,0,3-1.346,3-3V7c0-1.654-1.346-3-3-3H5Zm13,9h-4c-1.103,0-2-.897-2-2v-2c0-1.103,.897-2,2-2h4c1.103,0,2,.897,2,2v2c0,1.103-.897,2-2,2Zm-4-4v2h4.001v-2h-4.001Zm-4,3c0-.552-.448-1-1-1H5c-.552,0-1,.448-1,1s.448,1,1,1h4c.552,0,1-.448,1-1Zm10,4c0-.552-.448-1-1-1H5c-.552,0-1,.448-1,1s.448,1,1,1h14c.552,0,1-.448,1-1Z"/></svg>
                        RA
                        <span class="asterisco">*</span>
                    </label>
                    <input class="campo" type="text" id="ra" name="ra" required>
                </div>

                <div class="agrup_campo">
                    <label for="email">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" data-name="Layer 1" viewBox="0 0 24 24"><path d="M21.793,4c-.112-.319-.378-.559-.706-.639-.172-.042-4.257-1.025-9.087-1.025-4.744,0-8.907,.982-9.082,1.024-.333,.08-.601,.323-.712,.646-.049,.143-1.206,3.536-1.206,7.994s1.156,7.852,1.206,7.994c.112,.324,.383,.568,.717,.646,.178,.042,4.42,1.023,9.078,1.023,4.819,0,8.914-.983,9.086-1.025,.33-.08,.596-.322,.708-.643,.049-.141,1.206-3.51,1.206-7.996,0-4.525-1.158-7.86-1.207-8Zm-9.793,.336c3.591,0,6.82,.589,8.067,.848,.069,.241,.156,.561,.247,.949-.56,.591-1.981,2.025-3.959,3.551-1.642,1.267-3.499,2.381-4.355,2.875-.856-.494-2.71-1.606-4.356-2.876-1.973-1.521-3.39-2.951-3.954-3.545,.091-.388,.177-.71,.246-.953,1.264-.259,4.527-.849,8.064-.849Zm8.064,14.479c-1.251,.26-4.483,.848-8.064,.848-3.472,0-6.785-.593-8.066-.852-.304-1.072-.934-3.668-.934-6.812,0-1.265,.103-2.444,.246-3.471,.77,.742,1.851,1.716,3.177,2.739,2.338,1.804,4.986,3.258,5.098,3.319,.15,.082,.315,.123,.48,.123s.33-.041,.479-.123c.112-.061,2.76-1.515,5.098-3.319,1.329-1.025,2.411-2.001,3.182-2.743,.14,1.021,.241,2.198,.241,3.475,0,3.152-.631,5.748-.936,6.815Z"/></svg>
                        E-mail
                        <span class="asterisco">*</span>
                    </label>
                    <input  class="campo" type="email" id="email" name="email" required placeholder="example@email.com">
                </div>

                <div class="agrup_campo">
                    <label for="telefone">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" viewBox="0 0 24 24" width="512" height="512"><path d="M15,0H9A5.006,5.006,0,0,0,4,5V19a5.006,5.006,0,0,0,5,5h6a5.006,5.006,0,0,0,5-5V5A5.006,5.006,0,0,0,15,0ZM9,2h6a3,3,0,0,1,3,3V16H6V5A3,3,0,0,1,9,2Zm6,20H9a3,3,0,0,1-3-3V18H18v1A3,3,0,0,1,15,22Z"/><circle cx="12" cy="20" r="1"/></svg>
                        Telefone
                    </label>
                    <input  class="campo" type="text" id="telefone" name="telefone" placeholder="DDD Telefone">
                </div>

                <div class="agrup_campo">
                    <label for="password">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" viewBox="0 0 24 24" width="512" height="512"><path d="M19,8.424V7A7,7,0,0,0,5,7V8.424A5,5,0,0,0,2,13v6a5.006,5.006,0,0,0,5,5H17a5.006,5.006,0,0,0,5-5V13A5,5,0,0,0,19,8.424ZM7,7A5,5,0,0,1,17,7V8H7ZM20,19a3,3,0,0,1-3,3H7a3,3,0,0,1-3-3V13a3,3,0,0,1,3-3H17a3,3,0,0,1,3,3Z"/><path d="M12,14a1,1,0,0,0-1,1v2a1,1,0,0,0,2,0V15A1,1,0,0,0,12,14Z"/></svg>
                        Senha
                        <span class="asterisco">*</span>
                    </label>
                    <input  class="campo" type="password" id="password" name="password" required>
                </div>
                
                <div class="agrup_campo">
                    <label for="confPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icones" viewBox="0 0 24 24" width="512" height="512"><path d="M19,8.424V7A7,7,0,0,0,5,7V8.424A5,5,0,0,0,2,13v6a5.006,5.006,0,0,0,5,5H17a5.006,5.006,0,0,0,5-5V13A5,5,0,0,0,19,8.424ZM7,7A5,5,0,0,1,17,7V8H7ZM20,19a3,3,0,0,1-3,3H7a3,3,0,0,1-3-3V13a3,3,0,0,1,3-3H17a3,3,0,0,1,3,3Z"/><path d="M12,14a1,1,0,0,0-1,1v2a1,1,0,0,0,2,0V15A1,1,0,0,0,12,14Z"/></svg>
                        Confirme sua senha
                        <span class="asterisco">*</span>
                    </label>
                    <input class="campo" type="password" id="confPassword" name="confPassword" required>
                </div>

                <div class="radio">
                    <div class="termo">
                        <input type="radio" id="termos" name="termos" value="aceito">
                        <label for="termos">Leia nossa <a href="https://www.vemprafam.com.br/" target="_blank">Política de Privacidade</a>.</label>
                    </div>
                    
                    <div class="termo">
                        <input type="radio" id="politica" name="politica" value="aceito">
                        <label for="politica">Concorde com os <a href="termosDeUso.html" target="_blank"> Termos de uso</a> da plataforma.</label>
                    </div>
                    
                </div>

                <input id="cadastrar" type="submit" value="Cadastrar">
            </form>
        </main>
    </div>
</body>
</html>
