<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha</title>
    <link rel="stylesheet" href="style/styleNovaSenha.css">
</head>
<body>
    <div class="corpo">
        <header>
            <img id="logo1" src="src/logo_empresa.png" alt="Logo da FAM">
        </header>
        <main>
            <div class="container">
                <div id="titulo">
                    <h1>Insira sua nova Senha</h1>
                </div>
                <form action="">
                    <div>
                        <input type="password" id="campoSenha" name="Senha" required placeholder="Digite sua senha *">
                        <input type="password" id="campoSenhaNovamente" name="SenhaNovamente" required placeholder="Digite novamente sua senha *"> 
                    </div>
                    <div class="ajuda">
                        <p>* Mínimo de 8 caracteres</p>
                        <p>* Letras maíusculas, minúsculas, números e símbolos</p>
                    </div>
                    <div class="acoes">
                        <button class="botao-cancelar" type="button" onclick="window.location.href='../login/index.html'">Cancelar</button> <!-- Isso deverá estar numa função no scritp js -->
                        <button class="botao-salvar" type="button" onclick="window.location.href='../login/index.html'" >Salvar</button> <!-- Isso deverá estar numa função no scritp js -->
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
