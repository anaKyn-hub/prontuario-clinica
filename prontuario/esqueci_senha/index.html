<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha</title>
    <link rel="stylesheet" href="style/styleEsqueci.css">
</head>
<body>
    <div class="corpo">  
        <header>
            <img id="logo1" src="src/logo_empresa.png" alt="Logo da FAM">
        </header>
        <main>
            <div class="container">
                <div id="titulo">
                    <h1>Insira seu e-mail para recuperação de senha.</h1>
                </div>
                <form action="">
                <div>
                        <p id="descricao">Digite seu e-mail abaixo.</p>
                        <input type="email" id="campoEmail" name="E-mail" required placeholder="  E-mail*">
                    </div> 
                    <div class="acoes">
                        <button class="botao-cancelar">Cancelar</button>
                        <button class="botao-enviar">Enviar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
