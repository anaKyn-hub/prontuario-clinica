<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha</title>
    <link rel="stylesheet" href="style/styleEsqueci">
</head>
<body>
    <div class="corpo">  
        <header>
            <img id="logo1" src="src/logo_empresa.png" alt="Logo da FAM">
            <img src="" alt="">
        </header>
        <main>
            <div id="titulo">
                <h1>Verifique seu e-mail e insira uma nova senha.</h1>
                <p id="descricao">Enviamos o código para ...</p>
            </div>
            <form action="">
               <div>
                    <input type="email" id="campoEmail" name="E-mail" required placeholder="example@email.com">
                </div> 
                <div>
                    <p>Mínimo 8 caracteres.</p>
                    <p>Necessário conter letras maíusculas/minúsculas e números</p>
                </div>
                <div>
                    <input type="submit" value="Enviar">
                </div>
            </form>
        </main>
    </div>
</body>
</html>
