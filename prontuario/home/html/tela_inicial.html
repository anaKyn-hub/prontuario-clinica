                <main id="main">

                        <section id="section">

                        </section>

                        <img src="" alt="">Chatbot
                    </div> -->

                <footer>
                    <div class="termos">

            <script>
                function openNav() {
                    document.getElementById("sideNav").style.display = "flex";
                    document.getElementById("sideNav").style.width = "12vw";
                    document.getElementById("corpo").style.width = "88vw";
                    document.getElementById("main").style.width = "88vw";
                    document.getElementById("section").style.width = "88vw";
                    
                    document.getElementById("perfil").style.setProperty(
                        "border-bottom",
                        "1px solid #FF8400"
                    );
                    perfil.style.setProperty(
                        "box-shadow",
                        "0 5px 4px -4px rgba(0, 0, 0, 0.2)"
                    );
                    document.getElementById("barra-menu").style.display = "none";
                    document.getElementById("barra-menu").style.opacity = "1";
                    document.getElementById("barra-menu").style.pointerEvents = "none";
                }

                function closeNav() {
                    document.getElementById("sideNav").style.display = "none";
                    document.getElementById("corpo").style.width = "100vw";
                    document.getElementById("main").style.width = "100vw";
                    document.getElementById("section").style.width = "100vw";
                    document.getElementById("perfil").style.setProperty(
                        "border-bottom",
                        "1px solid #FF8400"
                    );
                    perfil.style.setProperty(
                        "box-shadow",
                        "0 5px 4px -4px rgba(0, 0, 0, 0.2)"
                    );
                    document.getElementById("barra-menu").style.display = "block";
                    document.getElementById("barra-menu").style.pointerEvents = "all";
                    document.getElementById("barra-menu").style.opacity = "1";
                }
            </script>
        </div>
